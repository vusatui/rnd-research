server {
    listen 443 ssl;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256;
    ssl_ecdh_curve prime256v1;
    ssl_certificate     /etc/ssl/gateway.pem;      # RSA-2048 leaf, issued by a public CA
    ssl_certificate_key /etc/ssl/gateway.key;
}
