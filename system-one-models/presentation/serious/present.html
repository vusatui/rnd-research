<script>
const S = [{"img": "export/slide-01-title.png", "video": null, "poster": null, "notes": "<h3>Slide 01 \u00b7 Title \u00b7 1.5 min</h3><p>Hello everyone, and thank you for being here. Today I want to talk about a kind of AI model that does not write text at all. Instead, it makes a decision. These models are called System One models, and the one we will look at closely is called Jev.</p><p>Here is the plan for the next half hour. First, I will explain what these models are and how they differ from the chatbots we already know. Then we will look at what a single call to one of them looks like, and where such a model fits into real work. After that, I will run a short live example, so you can see a request and a response with your own eyes. Near the end, I will show you where you can try all of this yourself.</p><p>I will keep it practical and fairly light. You do not need any machine learning background to follow along. If you have ever called a web API, you already know almost everything you need. It is also fine to ask questions along the way, although I will leave a couple of minutes at the end for them. So let&#x27;s start with the basic idea.</p>"}, {"img": "export/slide-02-two-kinds-of-models.png", "video": null, "poster": null, "notes": "<h3>Slide 02 \u00b7 Two kinds of AI models \u00b7 2.5 min</h3><p>Most of the AI we use every day is a text generator. You give it some text, and it gives you more text back. That could be an answer, a summary, an email draft, or a piece of code. This is what the top row of the slide shows, and it is what we usually mean when we say a large language model.</p><p>Now look at the bottom row. A decision model starts with the same kind of input, some text. But what comes out is not more text. What comes out is a decision. It might be a choice among a few options that you defined yourself, a score on a scale, or the probability that the answer to a yes or no question is yes. On the slide this is drawn as a small bar chart and a check mark, because the result is a set of numbers and a pick, not a paragraph.</p><p>I think this difference matters a lot for developers. When a generator answers with words, your program has to read those words and work out what they mean. When a decision model answers, your program receives a result it can use directly. There is no free text to parse, and no guessing whether the model said yes or maybe. Let me give you a small example to make this concrete. Suppose a customer writes to you, and you want to know which team should handle the message. With a generator, you might get a friendly paragraph that starts with the words, it looks like this message is about a technical problem. Your program then has to find the word technical somewhere inside that paragraph. With a decision model, you get the word technical, together with a number that says how sure the model is. That is a much easier thing to build on.</p><p>That is the whole idea of the talk in one sentence. So where does the strange name System One come from? Let&#x27;s look at that next.</p>"}, {"img": "export/slide-03-fast-and-slow.png", "video": null, "poster": null, "notes": "<h3>Slide 03 \u00b7 Two ways to think \u00b7 1.5 min</h3><p>The name comes from a well-known idea by the psychologist Daniel Kahneman, who described it in his book Thinking, Fast and Slow. He said that people have two modes of thinking. System one is fast and instinctive. It is what you use when you glance at a message and just know it is spam. System two is slow and deliberate. It is what you use when you plan a budget or work through a hard problem step by step.</p><p>The vendor&#x27;s own documentation uses this analogy for these models, and I find it helpful. The point is on the bottom of the slide. Decision models are built for the quick judgement calls, the System One kind of jobs. They are not meant to replace careful reasoning. You could say that a good team uses both modes. A person does not think hard about every single email, because that would be exhausting and slow. They sort most things quickly, and they save the careful thinking for the few cases that really need it. We can build software the same way, and we will come back to this idea when we talk about using a fast model first.</p><p>Now that we have the idea, let me introduce the specific model we will use today.</p>"}, {"img": "export/slide-04-what-is-jev.png", "video": null, "poster": null, "notes": "<h3>Slide 04 \u00b7 What is Jev? \u00b7 1.5 min</h3><p>Jev is a hosted System One model from a company called TypeSafe AI. Hosted simply means that you do not run it yourself. You send a request over the internet, and you get an answer back. Its own documentation describes it as the first model of this kind.</p><p>The slide shows three simple facts about Jev. First, it is one HTTP call. Second, it generates no text. Third, it returns typed answers, which means a choice, a score or a yes or no probability, rather than sentences.</p><p>One small warning before we continue. If you search the internet for Jev, you will find many unofficial websites with launch dates, funding figures and speed numbers. I have not been able to verify those, so I will not quote them today. Everything I say about Jev comes from the official documentation. So how would you actually use it? There is no special software to install, and no model to download. If you can send a request from your own code, you can use Jev. In the next few slides, I will show you what such a request contains, what comes back, and what you can do with it. I think you will see that it is simpler than it sounds.</p><p>With that in place, let&#x27;s look at what a call actually looks like.</p>"}, {"img": "export/slide-05-one-call-one-decision.png", "video": null, "poster": null, "notes": "<h3>Slide 05 \u00b7 One call, one decision \u00b7 2.5 min</h3><p>Let&#x27;s walk through this picture from left to right. On the left, you send two things to Jev. The first is the state. That is simply the text you want it to look at, for example a message from a customer. The second is the list of questions. These are the things you want to know about that text, and you describe the possible answers in plain words.</p><p>In the middle is Jev itself. It reads the text and the questions in one pass. On the right is what comes back. For a question with several options, you get a number for each option, and the model also tells you which one it picked and how confident it is. For a yes or no question, you get the probability of yes. On the slide this is drawn as a bar for the department and a gauge for urgency.</p><p>Please note that this drawing is an illustration, not real output. We will see a real response in a few minutes. The important thing to remember is that the answer is numbers, not sentences. Your code can act on those numbers right away. You ask the questions you care about, and the model replies with a typed answer for each of them. Typed here means that every answer has a clear shape. A choice always comes back as a choice, and a yes or no question always comes back as a probability. Because of that, you can write ordinary code against it, in the same way you would write code against any other well-defined web interface.</p><p>It is also worth noticing what is missing from this picture. There is no long prompt, no instructions about the format of the output, and no code to clean up the answer. You describe what you want to know, and the shape of the reply is already decided for you. Let&#x27;s look more closely at the kinds of questions you can ask.</p>"}, {"img": "export/slide-06-three-kinds-of-questions.png", "video": null, "poster": null, "notes": "<h3>Slide 06 \u00b7 Three kinds of questions \u00b7 1.5 min</h3><p>There are three kinds of questions, and they cover a surprising amount of everyday work. The first is a choice. You give a list of options, such as billing, technical and sales, and the model picks one and tells you how likely each option is.</p><p>The second is a score. Here you define an ordered scale, for example from calm to angry, and the model places the text somewhere on it.</p><p>The third is a yes or no question, such as whether a message is urgent. The answer is the probability of yes. In the Jev interface this type is called noul, which is a slightly odd name, but you only need to remember that it means yes or no.</p><p>You can ask several questions about the same text in a single call. And because you describe the options in plain words in the request, you can change them at any time, without retraining anything. For example, with a single support ticket you might ask which team should handle it, how angry the customer sounds, and whether it is urgent, all in the same request. Jev is not the only product that works this way, so let&#x27;s take a quick look around.</p>"}, {"img": "export/slide-07-not-only-jev.png", "video": null, "poster": null, "notes": "<h3>Slide 07 \u00b7 Not only Jev \u00b7 1 min</h3><p>The same idea exists elsewhere. OpenAI has a Decisions API, which was in beta when I looked into this. Cloudflare has released a decision model called Clef, with open weights, which you can use on its Workers AI platform. And the team at Unsloth has published a recipe for training your own decision model.</p><p>These are different vendors, but the shape is similar. You send text and questions in, and you get typed answers back. If you ask me which one is best, my honest answer is that I do not know, because there is no independent comparison yet. The benchmark numbers that exist come from the vendors themselves, so the right approach is to test on your own data. So where would you use a model like this?</p>"}, {"img": "export/slide-08-where-it-fits.png", "video": null, "poster": null, "notes": "<h3>Slide 08 \u00b7 Where it fits \u00b7 1 min</h3><p>Here are six everyday jobs where a decision model fits well. Routing, moderation, fraud triage, form checks, intent detection, and approvals.</p><p>What these have in common is that a person could look at each item and decide in a second or two, but there are far too many items for a person to handle them all. That is exactly the gap a fast decision model can fill. Think about the work behind a busy online shop, a large community forum or a payment system. In each of them, there is a constant stream of small questions. Where should this message go? Is this comment acceptable? Does this payment look unusual? None of these questions needs an essay. Each of them needs a quick and consistent answer, and that is the sweet spot for a decision model. Over the next three slides, I will show three of these jobs in a little more detail.</p>"}, {"img": "export/slide-09-use-case-routing.png", "video": null, "poster": null, "notes": "<h3>Slide 09 \u00b7 Routing \u00b7 1 min</h3><p>The first example is routing. Please keep in mind that this is an illustration I made up to explain the idea. Imagine a support ticket arrives. Jev reads it and picks the right team, and in this case the technical team gets it.</p><p>The dashed arrow at the bottom is the part I find most interesting. When the model is not confident about its answer, the ticket does not go to a team at random. It goes to a person. And the threshold for what counts as not confident is a decision made by your code, not by the model. This way the fast and cheap path handles the easy tickets, and your support staff spend their time on the ones that are genuinely unclear. This idea of letting people handle the unclear cases comes back in the next example.</p>"}, {"img": "export/slide-10-use-case-moderation.png", "video": null, "poster": null, "notes": "<h3>Slide 10 \u00b7 Moderation \u00b7 1 min</h3><p>The second example is moderation, and again this is an illustration. A comment comes in, and the model judges it. It might say allow, send to a human, or block.</p><p>You can think of it as a scale. At one end, the model is sure the comment is fine. At the other end, it is sure the comment breaks the rules. The clear cases at both ends can be handled automatically. The unclear cases in the middle are for people. The simple rule is to act when you are sure, and ask a person when you are not. That keeps the moderators focused on the difficult decisions, instead of reading every single comment from top to bottom.</p>"}, {"img": "export/slide-11-use-case-fraud-triage.png", "video": null, "poster": null, "notes": "<h3>Slide 11 \u00b7 Fraud triage \u00b7 1 min</h3><p>The third example is fraud triage, and once more, this is an illustration. A payment comes in, and the model gives it a risk score. If the score is low, the payment takes the fast path. If it is above the threshold, an analyst takes a closer look.</p><p>I want to be clear about one thing here. This is a first look, not a verdict. The model does not accuse anyone of anything. It only helps to decide which payments deserve a human&#x27;s time. In other words, most normal payments go through without delay, and the unusual ones get attention from someone who can judge them properly. That brings me to a question that comes up often, which is how to make this cheaper and faster in practice.</p>"}, {"img": "export/slide-12-fast-first.png", "video": null, "poster": null, "notes": "<h3>Slide 12 \u00b7 Fast first \u00b7 2 min</h3><p>A common pattern is to put the fast decision model in front. It answers most of the requests by itself, quickly and cheaply. Only the requests it is not sure about are passed on to a big language model, which is slower and more expensive but can think more carefully. You can see this on the slide. Most requests leave through the top, and only a few take the dashed path down to the big model.</p><p>I want to be careful here. I will not give you a percentage for how many requests stay at the first step. That number depends entirely on your data and on the thresholds you choose, and I do not have a verified figure for Jev. Other published work in this area, for example from Cloudflare and Unsloth, reports its own results, but those are claims from the vendors.</p><p>So if someone asks how much you would save, the honest answer is to measure it. Take a sample of your own traffic, try the approach, and look at the numbers. You may also notice that this brings us back to the two ways of thinking from earlier. The fast model plays the part of the quick instinct, and the big model plays the part of careful thought. Each one is used where it makes the most sense.</p><p>Now it is time to see this in practice, so let me show you the demo.</p>"}, {"img": "export/slide-13-demo-request.png", "video": null, "poster": null, "notes": "<h3>Slide 13 \u00b7 Demo, the request \u00b7 1.5 min</h3><p>Let me show you what a real request looks like. On the slide you can see it, shortened so that it fits on the screen. It has two parts. The first is the state, which is the text to judge. Here it is a support ticket saying that an API integration has been returning errors for twenty minutes. The second part is the questions. I ask two of them. The first one is the department, which is a choice between billing, technical and sales. The second one asks whether the message is urgent, which is a yes or no question.</p><p>Before we watch the demo, I want to be honest about what is behind it. We did not have access to a real Jev key when I prepared this talk, so the demo uses a small local emulator. It accepts the same request as Jev, but behind it is a free chat model. It asks that model the same question five times and reports the share of votes as if they were probabilities. So the request you will see is the real shape, but the engine is different, and the numbers are not Jev&#x27;s numbers. With a real key, the same code works by changing two settings.</p><p>I recorded the demo in advance, so we do not depend on the network here. Everything you will see is the real code from the repository and the real output of a run I recorded while preparing this talk.</p>"}, {"img": "export/slide-14-demo-1-the-files.png", "video": "demo/videos/demo-1-files.mp4", "poster": "demo/videos/demo-1-files.poster.jpg", "notes": "<h3>Slide 14 \u00b7 Demo 1, the files \u00b7 1 min</h3><p><em>[the clip starts by itself; press K to pause it, R to restart it]</em></p><p>This is the light workshop folder from the repository. It is one folder, and three Python files in it matter. The first one is the emulator. It is a small local server that accepts the same request as Jev, and its very first line says clearly that it is not Jev. The second one is the client. It has three short examples, and the same code would talk to real Jev if you change the address and the key. The third one holds offline keyword rules. They are only a fallback for when there is no network, and every answer they produce is labelled as mock. Finally, the Makefile runs everything in Docker, so the only things you need on your laptop are Docker and make.</p>"}, {"img": "export/slide-15-demo-2-the-code.png", "video": "demo/videos/demo-2-code.mp4", "poster": "demo/videos/demo-2-code.poster.jpg", "notes": "<h3>Slide 15 \u00b7 Demo 2, the code \u00b7 1.5 min</h3><p><em>[the clip starts by itself]</em></p><p>Let&#x27;s open the client. Everything goes through one small function that sends a single HTTP call. It posts to the system one endpoint with three things: the model name, the state and the questions.</p><p>The state is simply the text that the model should judge. Here it is the support ticket about the API returning errors for twenty minutes. The questions describe what we want back. The first is a choice between three teams, and each team has a short description. The second is a yes or no question about urgency, which Jev calls noul.</p><p>Now the line I care about most. The model only answers, and our code decides. If the confidence is at least zero point seven, we send the ticket to that team, and otherwise we ask a person. The moderation example has the same shape with different questions, and it includes review as an answer for cases of doubt. The expense example shows that the state can also be structured data.</p><p>Now let&#x27;s look behind the endpoint. The emulator asks a free language model the same question five times and turns the share of votes into probabilities. Real Jev does not vote. It scores every option in one pass. The answers come back typed, and every response is labelled as emulator output, so nobody can mistake it for Jev.</p>"}, {"img": "export/slide-16-demo-3-run-it.png", "video": "demo/videos/demo-3-run.mp4", "poster": "demo/videos/demo-3-run.poster.jpg", "notes": "<h3>Slide 16 \u00b7 Demo 3, run it \u00b7 1.5 min</h3><p><em>[the clip starts by itself]</em></p><p>Now we run it. Nothing is installed on this machine except Docker and make. The help screen lists the commands, and make lite is the one for this talk. There is also an offline version for when there is no network at all.</p><p>First, the ticket. The command starts the emulator inside a container and sends one request. The department comes back as technical with a confidence of one, because all five votes agreed. Urgent also comes back as one. That is the probability of yes, or here, the share of yes votes. Since one is above zero point seven, the code routes the ticket on its own.</p><p>Next, the rude comment. This time the votes are split. Review got zero point six, and block got zero point four. The model is not sure, and that uncertainty is exactly what I want you to see. Here are both answers side by side with the same threshold. The ticket is clear, so it is handled automatically. The comment falls below the line, so a person should look at it. In an earlier run, the same comment leaned towards block instead, which shows how a borderline case can flip from one run to the next.</p><p>Last, the expense. The state is a small piece of JSON, and the answer is approve, with full confidence that it is within the policy.</p>"}, {"img": "export/slide-17-demo-4-the-threshold.png", "video": "demo/videos/demo-4-threshold.mp4", "poster": "demo/videos/demo-4-threshold.poster.jpg", "notes": "<h3>Slide 17 \u00b7 Demo 4, the threshold \u00b7 1 min</h3><p><em>[the clip starts by itself]</em></p><p>The last clip comes from the deeper workshop, and it shows what the threshold really changes. Here the fast model is a small classic classifier, trained on only twenty-four tickets. When its confidence is below the threshold, the ticket is escalated. In this sweep, escalations go to a human queue, and we assume the human is always right.</p><p>We run it for four thresholds on sixteen test tickets. At zero point three, only four tickets are escalated, and accuracy is fifty percent. At zero point five, twelve are escalated, and accuracy rises to eighty-seven and a half percent. At zero point seven and above, every ticket goes to a person, so accuracy is perfect, but nothing is automated any more. This little classifier is weak, so the numbers are extreme. The point is the trade-off, and you are the one who chooses where to draw the line. That is the end of the demo, so let me go back to the slides.</p>"}, {"img": "export/slide-18-use-it-skip-it.png", "video": null, "poster": null, "notes": "<h3>Slide 18 \u00b7 Use it, skip it \u00b7 1.5 min</h3><p>So when is a decision model the right tool, and when is it not? It is a good fit for sorting things into groups, for yes or no checks, for high volumes, and for situations where you need fast answers.</p><p>It is not the right tool for writing text. The Jev documentation says plainly that it does not write replies, code or explanations. It is also not for explaining why it decided something, for reasoning that takes many steps, or for open conversation. For those jobs, a large language model is the better choice.</p><p>Think of it as choosing between a sorting machine and a writer. The sorting machine is built to be fast and to handle a large volume, but it can only sort. The writer can explain, argue and create, but it is slower and more expensive for each answer. Many good systems use both, each for what it does well.</p><p>A simple way to remember this is that the decision model will tell you whether to open an email, but it will not write the reply for you. And like any tool, it has some limits that are worth knowing about.</p>"}, {"img": "export/slide-19-honest-limits.png", "video": null, "poster": null, "notes": "<h3>Slide 19 \u00b7 Honest limits \u00b7 1.5 min</h3><p>I would like to be open about four limits. First, these models are text first. The documentation does not offer audio or video. Image input exists only behind an experimental setting, so I would treat it as not ready for real use.</p><p>Second, English works best. The documentation says that other languages are handled less well, so if your data is in another language, test it carefully before you rely on it.</p><p>Third, always test on your own data. The probabilities are only as trustworthy as the checks you run yourself.</p><p>And fourth, most of the speed and quality numbers you will read about come from the vendors, so please treat them as claims and not as proof. Independent evaluations are still thin. None of these limits is a reason to avoid the technology. They are simply reasons to try it carefully, on a small sample, before you build anything important on top of it. A short experiment with your own examples will tell you far more than any announcement can. With these limits in mind, let me pull the main points together.</p>"}, {"img": "export/slide-20-three-takeaways.png", "video": null, "poster": null, "notes": "<h3>Slide 20 \u00b7 Three takeaways \u00b7 1 min</h3><p>If you remember only three things from this talk, I hope they are these. First, choose the right model for the job. Use a decision model for quick judgement calls, and a language model for writing and reasoning.</p><p>Second, the model answers, and your code decides. The thresholds, the routing and the human review are all yours to design.</p><p>And third, go fast first, and use the big model only when the fast one is unsure. That is a simple pattern, and it works for many kinds of problems. If you forget everything else, remember that a decision model is a quick specialist, and that you are always the one in charge of what happens next.</p>"}, {"img": "export/slide-21-try-it-yourself.png", "video": null, "poster": null, "notes": "<h3>Slide 21 \u00b7 Try it yourself \u00b7 1 min</h3><p>If you would like to try this yourself, everything is in a public repository on GitHub. You can see the address on the slide, and you can also scan the code with your phone. Look for the folder called system-one-models.</p><p>In that folder, you will find the research notes with their sources, a comparison of the different approaches, a hands-on workshop with code you can run, and the slides from this talk. I suggest you start by running the workshop, which takes about fifteen minutes and works for free with the emulator. Then try changing the questions and the options, and watch how the answers move. After that, compare the different approaches, and read the sources behind the claims I made today.</p>"}, {"img": "export/slide-22-questions.png", "video": null, "poster": null, "notes": "<h3>Slide 22 \u00b7 Questions \u00b7 2 min</h3><p>That brings me to the end. To sum it up, a System One model does not write, it decides, and it is best used for quick judgement calls, with your code in charge and with people handling the unclear cases.</p><p>Along the way, we looked at the two kinds of models, at what a call to Jev looks like, at three everyday use cases, and at the pattern of using a fast model first. We also saw an honest demo, and a list of limits worth keeping in mind. Thank you very much for listening. I would be happy to take your questions now. If I do not know the answer, I will say so and find out, rather than guess.</p><p><em>[the rest of the two minutes is open for questions]</em></p>"}];
let i = 0, rates = [0.75, 1, 1.25], ri = 1;
const img = document.getElementById("img"), vid = document.getElementById("vid"), notes = document.getElementById("notes"),
      hud = document.getElementById("hud"), stage = document.getElementById("stage"), bar = document.getElementById("bar"), prog = document.getElementById("prog");
S.forEach(s => { const p = new Image(); p.src = s.img; });
function fit() { const k = Math.min(innerWidth / 1600, innerHeight / 900); stage.style.transform = `scale(${k}) translate(-50%,-50%)`; }
function show(n) {
  i = Math.max(0, Math.min(S.length - 1, n)); const s = S[i];
  img.src = s.img; notes.innerHTML = s.notes; vid.pause();
  if (s.video) { vid.src = s.video; vid.poster = s.poster; vid.playbackRate = rates[ri]; vid.style.display = "block"; bar.style.display = "block";
                 vid.currentTime = 0; vid.play().catch(() => {}); }
  else { vid.removeAttribute("src"); vid.load(); vid.style.display = "none"; bar.style.display = "none"; }
  location.hash = i + 1; status();
}
function status() { hud.textContent = `${i + 1}/${S.length}` + (S[i].video ? `  ·  ${vid.paused ? "paused" : "playing"} ${rates[ri]}x  ·  K pause  R restart  [ ] speed` : "") + "  ·  N notes  F fullscreen"; }
function toggle() { if (!S[i].video) return; vid.paused ? vid.play() : vid.pause(); status(); }
vid.addEventListener("timeupdate", () => { prog.style.width = (100 * vid.currentTime / (vid.duration || 1)) + "%"; });
vid.addEventListener("click", e => { e.stopPropagation(); toggle(); });
["play", "pause", "ended"].forEach(ev => vid.addEventListener(ev, status));
addEventListener("keydown", e => {
  const k = e.key;
  if (["ArrowRight", "PageDown", " "].includes(k)) { e.preventDefault(); show(i + 1); }
  else if (["ArrowLeft", "PageUp", "Backspace"].includes(k)) { e.preventDefault(); show(i - 1); }
  else if (k === "Home") show(0); else if (k === "End") show(S.length - 1);
  else if (["k", "K", "Enter", ".", "b", "B"].includes(k)) { e.preventDefault(); toggle(); }
  else if (k === "r" || k === "R") { vid.currentTime = 0; vid.play(); }
  else if (k === "[" || k === "]") { ri = Math.max(0, Math.min(2, ri + (k === "]" ? 1 : -1))); vid.playbackRate = rates[ri]; status(); }
  else if (k === "n" || k === "N") notes.style.display = notes.style.display === "block" ? "none" : "block";
  else if (k === "f" || k === "F") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
});
addEventListener("resize", fit); fit();
show((parseInt(location.hash.slice(1)) || 1) - 1);
</script></body></html>
