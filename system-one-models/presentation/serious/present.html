<script>
const S = [{"img": "export/slide-01-title.png", "video": null, "poster": null, "notes": "<h3>Slide 01 \u00b7 Title \u00b7 1.5 min</h3><p>Hello everyone, and thank you for being here. Today I want to talk about a kind of AI model that does not write text at all. Instead, it makes a decision. These models are called System One models, and the one we will look at closely is called Jev.</p><p>Here is the plan for the next half hour. First, I will explain what these models are and how they differ from the chatbots we already know. Then we will look at what a single call to one of them looks like, and where such a model fits into real work. After that, I will answer the question I expect from most of you: why not simply ask a normal language model for structured output with a confidence score? We measured exactly that, on the same set of tickets, and I will show you the real numbers. Then three short recorded demos, and at the end, where you can try all of this yourself.</p><p>You do not need any machine learning background. If you have ever called a web API, you already know almost everything you need. So let&#x27;s start with the basic idea.</p>"}, {"img": "export/slide-02-two-kinds-of-models.png", "video": null, "poster": null, "notes": "<h3>Slide 02 \u00b7 Two kinds of AI models \u00b7 1.75 min</h3><p>Most of the AI we use every day is a text generator. You give it some text, and it gives you more text back. That could be an answer, a summary, an email draft, or a piece of code. This is what the top row of the slide shows, and it is what we usually mean when we say a large language model.</p><p>Now look at the bottom row. A decision model starts with the same kind of input, some text. But what comes out is not more text. What comes out is a decision. It might be a choice among a few options that you defined yourself, a score on a scale, or the probability that the answer to a yes or no question is yes. On the slide this is drawn as a small bar chart and a check mark, because the result is a set of numbers and a pick, not a paragraph.</p><p>I think this difference matters a lot for developers. When a generator answers with words, your program has to read those words and work out what they mean. When a decision model answers, your program receives a result it can use directly. There is no free text to parse, and no guessing whether the model said yes or maybe.</p><p>That is the whole idea of the talk in one sentence. So where does the strange name System One come from? Let&#x27;s look at that next.</p>"}, {"img": "export/slide-03-fast-and-slow.png", "video": null, "poster": null, "notes": "<h3>Slide 03 \u00b7 Two ways to think \u00b7 1.25 min</h3><p>The name comes from a well-known idea by the psychologist Daniel Kahneman, who described it in his book Thinking, Fast and Slow. He said that people have two modes of thinking. System one is fast and instinctive. It is what you use when you glance at a message and just know it is spam. System two is slow and deliberate. It is what you use when you plan a budget or work through a hard problem step by step.</p><p>The vendor&#x27;s own documentation uses this analogy for these models, and I find it helpful. The point is on the bottom of the slide. Decision models are built for the quick judgement calls, the System One kind of jobs. They are not meant to replace careful reasoning. We can build software the same way, and we will come back to this idea when we talk about using a fast model first.</p><p>Now that we have the idea, let me introduce the specific model we will use today.</p>"}, {"img": "export/slide-04-what-is-jev.png", "video": null, "poster": null, "notes": "<h3>Slide 04 \u00b7 What is Jev? \u00b7 1.25 min</h3><p>Jev is a hosted System One model from a company called TypeSafe AI. Hosted simply means that you do not run it yourself. You send a request over the internet, and you get an answer back. Its own documentation describes it as the first model of this kind.</p><p>The slide shows three simple facts about Jev. First, it is one HTTP call. Second, it generates no text. Third, it returns typed answers, which means a choice, a score or a yes or no probability, rather than sentences.</p><p>One small warning before we continue. If you search the internet for Jev, you will find many unofficial websites with launch dates, funding figures and speed numbers. I have not been able to verify those, so I will not quote them today. Everything I say about Jev comes from the official documentation, or from measurements I made myself for this talk. Jev is also available through OpenRouter, which is how I called it.</p><p>With that in place, let&#x27;s look at what a call actually looks like.</p>"}, {"img": "export/slide-05-one-call-one-decision.png", "video": null, "poster": null, "notes": "<h3>Slide 05 \u00b7 One call, one decision \u00b7 2 min</h3><p>Let&#x27;s walk through this picture from left to right. On the left, you send two things to Jev. The first is the state. That is simply the text you want it to look at, for example a message from a customer. The second is the list of questions. These are the things you want to know about that text, and you describe the possible answers in plain words.</p><p>In the middle is Jev itself. It reads the text and the questions in one pass. On the right is what comes back. For a question with several options, you get a number for each option, and the model also tells you which one it picked and how confident it is. For a yes or no question, you get the probability of yes. On the slide this is drawn as a bar for the department and a gauge for urgency.</p><p>Please note that this drawing is an illustration, not real output. We will see a real response in a few minutes. The important thing to remember is that the answer is numbers, not sentences. Your code can act on those numbers right away. You ask the questions you care about, and the model replies with a typed answer for each of them. Typed here means that every answer has a clear shape. A choice always comes back as a choice, and a yes or no question always comes back as a probability. Because of that, you can write ordinary code against it, in the same way you would write code against any other well-defined web interface.</p><p>Let&#x27;s look more closely at the kinds of questions you can ask.</p>"}, {"img": "export/slide-06-three-kinds-of-questions.png", "video": null, "poster": null, "notes": "<h3>Slide 06 \u00b7 Three kinds of questions \u00b7 1.25 min</h3><p>There are three kinds of questions, and they cover a surprising amount of everyday work. The first is a choice. You give a list of options, such as billing, technical and sales, and the model picks one and tells you how likely each option is.</p><p>The second is a score. Here you define an ordered scale, for example from calm to angry, and the model places the text somewhere on it.</p><p>The third is a yes or no question, such as whether a message is urgent. The answer is the probability of yes. In the Jev interface this type is called noul, which is a slightly odd name, but you only need to remember that it means yes or no.</p><p>You can ask several questions about the same text in a single call. And because you describe the options in plain words in the request, you can change them at any time, without retraining anything. Jev is not the only product that works this way, so let&#x27;s take a quick look around.</p>"}, {"img": "export/slide-07-not-only-jev.png", "video": null, "poster": null, "notes": "<h3>Slide 07 \u00b7 Not only Jev \u00b7 1 min</h3><p>The same idea exists elsewhere. OpenAI has a Decisions API, which was in beta when I looked into this. Cloudflare has released a decision model called Clef, with open weights, which you can use on its Workers AI platform. And the team at Unsloth has published a recipe for training your own decision model.</p><p>These are different vendors, but the shape is similar. You send text and questions in, and you get typed answers back. If you ask me which one is best, my honest answer is that I do not know, because there is no independent comparison yet. The benchmark numbers that exist come from the vendors themselves, so the right approach is to test on your own data. So where would you use a model like this?</p>"}, {"img": "export/slide-08-where-it-fits.png", "video": null, "poster": null, "notes": "<h3>Slide 08 \u00b7 Where it fits \u00b7 1.25 min</h3><p>Here are six everyday jobs where a decision model fits well. Routing, moderation, fraud triage, form checks, intent detection, and approvals.</p><p>What these have in common is that a person could look at each item and decide in a second or two, but there are far too many items for a person to handle them all. That is exactly the gap a fast decision model can fill. Think about the work behind a busy online shop, a large community forum or a payment system. In each of them, there is a constant stream of small questions. Where should this message go? Is this comment acceptable? Does this payment look unusual? None of these questions needs an essay. Each of them needs a quick and consistent answer, and that is the sweet spot for a decision model. Let me show one of them, routing, in a little more detail, because it is also the task we measured.</p>"}, {"img": "export/slide-09-use-case-routing.png", "video": null, "poster": null, "notes": "<h3>Slide 09 \u00b7 Routing \u00b7 1 min</h3><p>The first example is routing. Please keep in mind that this is an illustration I made up to explain the idea. Imagine a support ticket arrives. Jev reads it and picks the right team, and in this case the technical team gets it.</p><p>The dashed arrow at the bottom is the part I find most interesting. When the model is not confident about its answer, the ticket does not go to a team at random. It goes to a person. And the threshold for what counts as not confident is a decision made by your code, not by the model. This way the fast and cheap path handles the easy tickets, and your support staff spend their time on the ones that are genuinely unclear. This idea of sending only the unclear cases somewhere else leads straight to a pattern called fast first.</p>"}, {"img": "export/slide-10-fast-first.png", "video": null, "poster": null, "notes": "<h3>Slide 10 \u00b7 Fast first \u00b7 1.75 min</h3><p>A common pattern is to put the fast decision model in front. It answers most of the requests by itself, quickly and cheaply. Only the requests it is not sure about are passed on, to a big language model or to a person. You can see this on the slide. Most requests leave through the top, and only a few take the dashed path down.</p><p>How many stay at the first step depends entirely on your data and on the threshold you choose, so I will not quote a vendor number. But I can tell you what we saw in our own test, which I will describe in a moment. On our support tickets, with the threshold at zero point nine five, Jev handled three quarters of the tickets on its own, and none of those automated answers was wrong in the test set. The other quarter went to a person. That is one small synthetic test, not a promise, but it shows the shape of the trade-off.</p><p>This also brings us back to the two ways of thinking from earlier. The fast model plays the part of quick instinct, and the big model or the person plays the part of careful thought. And now let me answer the question that I am sure some of you have been waiting to ask.</p>"}, {"img": "export/slide-11-the-real-alternative.png", "video": null, "poster": null, "notes": "<h3>Slide 11 \u00b7 The real alternative \u00b7 1 min</h3><p>The question is this. Why not just take a normal language model, ask it for structured output, and add a confidence field? You can see that on the left. A JSON schema with the department and a number, say zero point nine. Modern models follow such a schema reliably, so nobody parses free text any more. This is the real competitor to a decision model, and it is a serious one.</p><p>On the right is the decision model. Same input, and also a label and a number. So on the surface both give you the same thing. The difference is not in the format. The difference is in where the number comes from, and that is the next slide.</p>"}, {"img": "export/slide-12-where-the-number-comes-from.png", "video": null, "poster": null, "notes": "<h3>Slide 12 \u00b7 Where the number comes from \u00b7 1.75 min</h3><p>On the left, the language model writes its confidence. The number zero point nine is a few tokens that the model generates, the same way it generates any other word. It is one guess, written after the answer. In practice these written numbers are coarse. In our test, the models used only twelve to nineteen different values across a hundred and fifty tickets, mostly round numbers like zero point nine or zero point nine five. And those tokens are output, which you pay for and wait for.</p><p>On the right, the decision model computes a probability for every option in a single pass. Nothing is written. You get the whole distribution, not just one number, and the vendor says the model is trained to make those probabilities calibrated. Output is not billed.</p><p>Now, I want to be fair here. Research shows that written confidence from chat models is not nonsense. A 2023 study by Tian and colleagues found that for chat models it is often better calibrated than their raw token probabilities. Another study, by Xiong and colleagues, found that it tends to be overconfident, and that this gets better with stronger models. So it is a different kind of number, not a useless one. The only honest thing to do is to measure both. So we did.</p>"}, {"img": "export/slide-13-how-we-tested.png", "video": null, "poster": null, "notes": "<h3>Slide 13 \u00b7 How we tested \u00b7 1 min</h3><p>Here is how. We built two hundred and fifty realistic support tickets for a made-up software company, with five departments and three levels of urgency. Free models wrote them, and two other models labelled every ticket blindly, without seeing each other&#x27;s answers. Where the two labellers disagreed, we flagged the ticket as ambiguous.</p><p>We kept one hundred and fifty tickets aside as a test set. Every method saw exactly the same tickets and exactly the same descriptions of the options. Eight methods in total: Jev, strong and small chat models with written confidence, token probabilities, voting, and an old-school classifier. For each, we measured accuracy, calibration, latency and the cost per thousand tickets. One lesson from building this: use free models to make the data, and spend the paid budget only on the models you are testing.</p>"}, {"img": "export/slide-14-same-150-tickets.png", "video": null, "poster": null, "notes": "<h3>Slide 14 \u00b7 Same 150 tickets \u00b7 1.75 min</h3><p>These are the results for the department question. The top row is Jev. Ninety-three percent correct, a calibration error of zero point zero four, which is small, about a hundred and sixty milliseconds per ticket, and two and a half cents per thousand tickets. That is one call, with two questions in it.</p><p>The next two rows are strong chat models with structured output. GPT-6 Sol got the same ninety-three percent, with the same calibration error. Its written confidence was honest. But it took about two seconds, and it cost a dollar thirty-four per thousand tickets. Claude Sonnet got ninety-four percent, and its confidence was too modest: when it said fifty-seven percent, it was right three times out of four. It took one second and cost two dollars per thousand.</p><p>The cheap DeepSeek model was even a little more accurate, ninety-five percent, in half a second, for under five cents. Asking it five times and counting votes reached ninety-seven percent, but then the confidence has only three possible values, so it is a very blunt knob for a threshold.</p><p>Two honest remarks. First, the accuracy differences in this table are within the statistical noise of a hundred and fifty tickets. Second, on the harder, more subjective question of urgency, Jev was less accurate than the chat models, by four to nine points.</p>"}, {"img": "export/slide-15-what-the-numbers-say.png", "video": null, "poster": null, "notes": "<h3>Slide 15 \u00b7 What the numbers say \u00b7 1 min</h3><p>So what do the numbers say? Compared with strong chat models, the decision model was fifty to eighty times cheaper, and six to thirteen times faster. It answered both questions in one call and scored every option, so your code gets a full distribution to set thresholds on. Its accuracy and calibration were about the same as the strong models on the main question.</p><p>And here is the line I want you to take home. It was not more accurate. If you choose a decision model, choose it for price, speed and format, plus decent probabilities. Do not choose it because you expect it to be smarter. And whatever you use, a decision model or written confidence from a chat model, measure that confidence on your own data before you put a threshold on it.</p><p>Now let me show you how this looks in code.</p>"}, {"img": "export/slide-16-demo-request.png", "video": null, "poster": null, "notes": "<h3>Slide 16 \u00b7 Demo, the request \u00b7 1 min</h3><p>This is what a real request looks like, shortened to fit the screen. It has two parts. The state, which is the text to judge, here a support ticket saying that an API integration has been returning errors for twenty minutes. And the questions: the department, a choice between three teams, and whether the message is urgent, a yes or no question.</p><p>The demos you will see are recorded, so we do not depend on the network here, and everything in them is real code from the repository and real output. This time the requests go to the real Jev, through OpenRouter. There are three short clips, one for each exercise of the workshop.</p>"}, {"img": "export/slide-17-demo-1-one-call.png", "video": "demo/videos/demo-1-one-call.mp4", "poster": "demo/videos/demo-1-one-call.poster.jpg", "notes": "<h3>Slide 17 \u00b7 Demo 1, one call \u00b7 2 min</h3><p><em>[the clip starts by itself; press K to pause it, R to restart it]</em></p><p>Exercise one. The problem: one ticket, several things to decide, and the code should be in charge. The design is simple. One request carries all the questions. The model returns a probability for each answer, and our code turns those probabilities into actions, with a different threshold for each action.</p><p>Here is the request in the client, and here is the line where the code decides. A yes or no answer counts as yes above zero point seven and as no below zero point three, and everything in between gets its own outcome. Risky actions need more: blocking a comment or approving an expense needs at least zero point nine.</p><p>Now we run it against real Jev. The ticket goes to the technical team, with a probability of one, and urgent at zero point nine nine, so the on-call engineer is paged. That took about a quarter of a second, both questions in one request, and cost less than two thousandths of a cent. The rude comment comes back as block with zero point nine two, just above the bar, so it is blocked. And the expense, a forty-two dollar lunch for four people, which is clearly within policy, comes back as approve with only zero point six seven. That is below our zero point nine bar, so the code escalates it to a manager. This is the threshold doing its job. A structured output call could do the routing too, but it would need one generated answer per question, and it would give us one written number instead of a distribution.</p>"}, {"img": "export/slide-18-demo-2-same-tickets.png", "video": "demo/videos/demo-2-same-tickets.mp4", "poster": "demo/videos/demo-2-same-tickets.poster.jpg", "notes": "<h3>Slide 18 \u00b7 Demo 2, same tickets \u00b7 1.75 min</h3><p><em>[the clip starts by itself]</em></p><p>Exercise two is the comparison you just saw on the slides, as code. The problem: decide how to get a trustworthy confidence. The design is one dataset, one evaluation script, and five ways of getting a confidence, each in a small function in the same file.</p><p>Here is the structured output method. The schema has the department, the urgency, and a confidence field for each, and the prompt asks the model to be calibrated. Here is the token probability method, which reads the model&#x27;s own probabilities for the first token of each option. Here is the voting method, five samples at temperature one. And here is Jev, one request with both questions. All of them get exactly the same option descriptions.</p><p>Now we run the evaluation. It reads the saved results and prints one table: accuracy, calibration error, how much we could automate at ninety-five percent accuracy, the number of distinct confidence values, latency, and cost. And here are the reliability tables, confidence on the left and how often the model was right on the right. Look at the token probabilities on the urgency question. When they say ninety-eight percent, they are right only sixty-five percent of the time. That is overconfidence, and it is exactly what would hurt you if you put a threshold on it. The written confidence from GPT-6 Sol, by contrast, lines up well. Measure first, then trust.</p>"}, {"img": "export/slide-19-demo-3-the-threshold.png", "video": "demo/videos/demo-3-threshold.mp4", "poster": "demo/videos/demo-3-threshold.poster.jpg", "notes": "<h3>Slide 19 \u00b7 Demo 3, the threshold \u00b7 1.25 min</h3><p><em>[the clip starts by itself]</em></p><p>Exercise three answers the last practical question: where should the threshold be? The design is a small simulation. Every wrong automatic answer costs five dollars, every human review costs fifty cents, and we sweep the threshold from zero to one.</p><p>Here is the result for Jev. Automating everything costs three hundred and thirty-three dollars per thousand tickets, because of the mistakes. Sending everything to people costs five hundred. The cheapest point is a threshold of zero point nine five: three quarters automated, no mistakes in the test, a hundred and twenty-seven dollars. And at the bottom, the same optimum for every method. The strong chat models land at a hundred and thirty-five to a hundred and thirty-eight dollars, close to Jev. At this volume, the model&#x27;s own price is tiny compared to mistakes and reviews. Its price and speed start to matter at large volume and when you need an answer in milliseconds. That is the end of the demo.</p>"}, {"img": "export/slide-20-use-it-skip-it.png", "video": null, "poster": null, "notes": "<h3>Slide 20 \u00b7 Use it, skip it \u00b7 0.75 min</h3><p>So when is a decision model the right tool? It fits sorting things into groups, yes or no checks, high volumes, and situations where you need fast answers.</p><p>It is not the right tool for writing text, for explaining why it decided something, for reasoning that takes many steps, or for open conversation. The Jev documentation says plainly that it does not write replies, code or explanations. For those jobs, a large language model is the better choice. A simple way to remember it: the decision model tells you whether to open an email, but it will not write the reply.</p>"}, {"img": "export/slide-21-honest-limits.png", "video": null, "poster": null, "notes": "<h3>Slide 21 \u00b7 Honest limits \u00b7 1 min</h3><p>Four limits. First, these models read text, and Jev also reads images, but there is no audio or video.</p><p>Second, English works best. The documentation says other languages are handled less well, so test carefully if your data is in another language.</p><p>Third, test on your own data. Our own measurement used synthetic tickets labelled by language models, which gives chat models a home advantage, and a hundred and fifty tickets is a small sample. Your numbers will be different.</p><p>And fourth, most of the speed and quality numbers you will read come from the vendors, so treat them as claims, not proof. None of these limits is a reason to avoid the technology. They are reasons to try it on a small sample first.</p>"}, {"img": "export/slide-22-three-takeaways.png", "video": null, "poster": null, "notes": "<h3>Slide 22 \u00b7 Three takeaways \u00b7 1 min</h3><p>If you remember only three things, I hope they are these. First, pick a decision model for price, speed and format. In our test it was fifty to eighty times cheaper and up to thirteen times faster than strong chat models, at the same accuracy, but not better.</p><p>Second, the model answers, and your code decides. The thresholds, the routing and the human review are yours to design, and they can differ for every action.</p><p>And third, measure confidence on your own data, whatever method you use. Written confidence from a chat model can be good, and computed probabilities can be off. A reliability table on a few hundred of your own examples will tell you which one you can trust.</p>"}, {"img": "export/slide-23-try-it-yourself.png", "video": null, "poster": null, "notes": "<h3>Slide 23 \u00b7 Try it yourself \u00b7 0.75 min</h3><p>Everything is in a public repository on GitHub. You can see the address on the slide, or scan the code with your phone. Look for the folder called system-one-models.</p><p>There you will find the research notes with their sources, the workshop with its three exercises, the dataset, all saved results, and a methodology note that explains exactly how we tested. The whole comparison replays offline with one command, without any key. If you have an OpenRouter key, the same client talks to real Jev, and a run of the first exercise costs a fraction of a cent.</p>"}, {"img": "export/slide-24-questions.png", "video": null, "poster": null, "notes": "<h3>Slide 24 \u00b7 Questions \u00b7 2 min</h3><p>That brings me to the end. A System One model does not write, it decides. It is a fast and cheap way to make many small decisions with probabilities your code can act on, as long as your code stays in charge and people handle the unclear cases. And it is not magic: in our test it matched strong chat models on accuracy at a tiny fraction of the cost and time, but it did not beat them.</p><p>Thank you very much for listening. I would be happy to take your questions now. If I do not know the answer, I will say so and find out, rather than guess.</p><p><em>[the rest of the two minutes is open for questions]</em></p>"}];
let i = 0, rates = [0.75, 1, 1.25], ri = 1;
const img = document.getElementById("img"), vid = document.getElementById("vid"), notes = document.getElementById("notes"),
      hud = document.getElementById("hud"), stage = document.getElementById("stage"), bar = document.getElementById("bar"), prog = document.getElementById("prog");
S.forEach(s => { const p = new Image(); p.src = s.img; });
function fit() { const k = Math.min(innerWidth / 1600, innerHeight / 900); stage.style.transform = `scale(${k}) translate(-50%,-50%)`; }
function show(n) {
  i = Math.max(0, Math.min(S.length - 1, n)); const s = S[i];
  img.src = s.img; notes.innerHTML = s.notes; vid.pause();
  if (s.video) { vid.src = s.video; vid.poster = s.poster; vid.playbackRate = rates[ri]; vid.style.display = "block"; bar.style.display = "block";
                 vid.currentTime = 0; vid.play().catch(() => {}); }
  else { vid.removeAttribute("src"); vid.load(); vid.style.display = "none"; bar.style.display = "none"; }
  location.hash = i + 1; status();
}
function status() { hud.textContent = `${i + 1}/${S.length}` + (S[i].video ? `  ·  ${vid.paused ? "paused" : "playing"} ${rates[ri]}x  ·  K pause  R restart  [ ] speed` : "") + "  ·  N notes  F fullscreen"; }
function toggle() { if (!S[i].video) return; vid.paused ? vid.play() : vid.pause(); status(); }
vid.addEventListener("timeupdate", () => { prog.style.width = (100 * vid.currentTime / (vid.duration || 1)) + "%"; });
vid.addEventListener("click", e => { e.stopPropagation(); toggle(); });
["play", "pause", "ended"].forEach(ev => vid.addEventListener(ev, status));
addEventListener("keydown", e => {
  const k = e.key;
  if (["ArrowRight", "PageDown", " "].includes(k)) { e.preventDefault(); show(i + 1); }
  else if (["ArrowLeft", "PageUp", "Backspace"].includes(k)) { e.preventDefault(); show(i - 1); }
  else if (k === "Home") show(0); else if (k === "End") show(S.length - 1);
  else if (["k", "K", "Enter", ".", "b", "B"].includes(k)) { e.preventDefault(); toggle(); }
  else if (k === "r" || k === "R") { vid.currentTime = 0; vid.play(); }
  else if (k === "[" || k === "]") { ri = Math.max(0, Math.min(2, ri + (k === "]" ? 1 : -1))); vid.playbackRate = rates[ri]; status(); }
  else if (k === "n" || k === "N") notes.style.display = notes.style.display === "block" ? "none" : "block";
  else if (k === "f" || k === "F") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
});
addEventListener("resize", fit); fit();
show((parseInt(location.hash.slice(1)) || 1) - 1);
</script></body></html>
